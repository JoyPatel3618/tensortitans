# REFERENCE COPY - kept here for the repo/mentor to see the config.
# This exact file does NOT get used directly on Kaggle, because
# /kaggle/working/ is wiped every session. Instead, run
# data_prep/make_dataset_yaml.py in the notebook to (re)create this file
# fresh at /kaggle/working/dataset.yaml before training each time.

path: /kaggle/working/dataset
train: images/train
val: images/val

nc: 1                  # number of classes - just "pneumonia" here
names: ["pneumonia"]
